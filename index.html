<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Ask AI Tutor</title>
  <style>
    /* CSS: This controls how everything LOOKS */

    body {
      font-family: Arial, sans-serif;
      background: #f4f6fb;
      margin: 0;
      padding: 20px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .container {
      max-width: 800px;
      margin: 30px auto;
      background: white;
      padding: 25px;
      border-radius: 12px;
    }

    textarea {
      width: 100%;
      height: 80px;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 16px;
    }

    button {
      margin-top: 10px;
      padding: 12px 20px;
      background: #6c5ce7;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
    }

    button:hover { background: #5a4bd1; }

    #explanation {
      margin-top: 25px;
      padding: 20px;
      background: #eef2ff;
      border-radius: 10px;
      display: none; /* Hidden until we have an answer */
    }
  </style>
</head>
<body>

  <!-- HTML: This is the STRUCTURE of the page -->

  <header>
    <h2>📚 Ask AI Tutor</h2>
    <nav>Home | My Sessions | Profile</nav>
  </header>

  <div class="container">
    <h1>Ask a Question</h1>
    <p>Enter your question below and get a simple explanation.</p>

    <!-- The learner types here -->
    <textarea id="questionInput" placeholder="e.g. What is HTML?"></textarea>
    <br>

    <!-- This button triggers the JavaScript -->
    <button onclick="getExplanation()">Submit</button>

    <!-- The AI explanation will appear here -->
    <div id="explanation"></div>
  </div>

  <script>
    // JavaScript: This controls what HAPPENS

    function getExplanation() {
      // 1. Get what the learner typed
      const question = document.getElementById("questionInput").value;

      // 2. Find where to show the answer
      const box = document.getElementById("explanation");

      // 3. If empty, tell them to type something
      if (question.trim() === "") {
        alert("Please type a question first!");
        return;
      }

      // 4. Show a loading message
      box.style.display = "block";
      box.innerHTML = "Thinking...";

      // 5. After 1 second, show a fake AI answer
      // In a real app, this is where you'd call an AI API
      setTimeout(() => {
        box.innerHTML = `
          <h3>AI Generated Explanation</h3>
          <p><b>Your question:</b> ${question}</p>
          <p><b>Explanation:</b> This is where the AI would explain
          your question step-by-step in simple language.</p>
          <p><b>Example:</b> Think of it like learning by asking,
          then breaking a big idea into small, easy pieces.</p>
        `;
      }, 1000);
    }
  </script>

</body>
</html>
